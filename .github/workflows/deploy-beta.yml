name: Deploy beta preview alongside tested main site

on:
  push:
    branches: [feature/knowledge-leveling-planner]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout stable public main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - name: Checkout development beta
        uses: actions/checkout@v4
        with:
          ref: feature/knowledge-leveling-planner
          path: beta-source

      - name: Prepare unchanged public site plus isolated beta
        run: |
          mkdir -p _site/beta
          cp stable/index.html stable/styles.css stable/.nojekyll _site/
          cp -R stable/src stable/assets _site/
          cp beta-source/index.html beta-source/styles.css _site/beta/
          cp -R beta-source/src beta-source/assets _site/beta/
          test -f _site/index.html
          test -f _site/beta/index.html
          test -f _site/beta/src/idleon-firebase-popup.mjs
          test ! -e _site/beta/private
          # Public root must stay the exact files checked out from main.
          cmp stable/index.html _site/index.html
          cmp stable/styles.css _site/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
